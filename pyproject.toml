[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "supertab-connect-sdk"
version = "0.0.1"
authors = [
  { name = "Supertab", email = "hello@supertab.co" },
]
description = "Supertab Connect SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyJWT[crypto]>=2.10,<3",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.urls]
Homepage = "https://www.supertab.co/supertab-connect"
Repository = "https://github.com/getsupertab/connect-sdk-python"
Issues = "https://github.com/getsupertab/connect-sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/connect"]

[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
known-first-party = ["connect"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
