name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run ty check

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv run python -m build

  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out SDK (the PR)
        uses: actions/checkout@v4

      - name: Check out conformance suite (pinned)
        uses: actions/checkout@v4
        with:
          repository: getsupertab/connect-sdk-conformance
          ref: v0.3.0
          token: ${{ secrets.CONFORMANCE_REPO_TOKEN }}
          path: _conformance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install SDK dependencies
        run: uv sync --locked

      - name: Install conformance dependencies
        run: npm ci
        working-directory: _conformance

      - name: Run conformance corpus (Python runner)
        run: npm run conformance
        working-directory: _conformance
        env:
          STC_PY_RUNNER_CWD: ${{ github.workspace }}
          STC_ONLY: python
